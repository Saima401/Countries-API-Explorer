<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header-container">
      <div class="header-content">
        <h2>Where in the world?</h2>
        <p><i class="fa-regular fa-moon"></i> &nbsp Dark Mode</p>
      </div>
    </header>
    <button class="backBtn">Back</button>
    <div class="country-details">
      <img src="https://flagcdn.com/al.svg" alt="" class="flagImage" />
      <div class="details-div-h">
        <h1>Iceland</h1>
        <div class="details-div">
          <p><b>Native Name: </b> <span class="native-name"></span></p>
          <p><b>Population: </b><span class="population"></span></p>
          <p><b>Region: </b> <span class="region"></span></p>
          <p><b>Capital: </b><span class="capital"></span></p>
          <p><b>Top Level Domain: </b><span class="domain"></span></p>
          <p><b>Currencies: </b><span class="currency"></span></p>
          <p><b>Language: </b> <span class="language"></span></p>
        </div>
      </div>
    </div>

    <script src="country.js" defer></script>
  </body>
</html>
